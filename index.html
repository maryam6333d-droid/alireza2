<main><h1>یادبود علیرضا محمدرضایی</h1>
<div class="sub">برای شادی روح ایشان، یک ذکر انتخاب کنید</div>
<div class="dua">خداوند روح ایشان را قرین رحمت و آرامش قرار دهد و یادشان را در دل‌ها زنده نگه دارد. 🤍</div>
<div class="grid">
<button onclick="add('salavat')">📿 صلوات می‌فرستم<span class="num" id="salavat">۰</span></button>
<button onclick="add('fatiha')">🤲 فاتحه می‌خوانم<span class="num" id="fatiha">۰</span></button>
<button onclick="add('hamd')">📖 سوره حمد می‌خوانم<span class="num" id="hamd">۰</span></button>
<button onclick="add('towhid')">🌸 سوره توحید می‌خوانم<span class="num" id="towhid">۰</span></button>
</div>
<div class="total">مجموع نیت‌های ثبت‌شده: <b id="total">۰</b></div>
<button class="share" onclick="share()">🔗 اشتراک‌گذاری</button>
</main></div></div>
<script>
const keys=['salavat','fatiha','hamd','towhid'];
const fa=n=>Number(n).toLocaleString('fa-IR');
function load(){
 let t=0;
 keys.forEach(k=>{
  let n=Number(localStorage.getItem(k)||0);
  t+=n;
  document.getElementById(k).textContent=fa(n);
 });
 document.getElementById('total').textContent=fa(t);
}
function add(k){
 localStorage.setItem(k,Number(localStorage.getItem(k)||0)+1);
 load();
}
async function share(){
 if(navigator.share){
  await navigator.share({title:'یادبود علیرضا محمدرضایی',text:'برای شادی روح علیرضا محمدرضایی یک فاتحه یا صلوات نثار کنیم.',url:location.href});
 }else{
  await navigator.clipboard.writeText(location.href);
  alert('لینک صفحه کپی شد.');
 }
}
load();
</script></body></html>
